[project]
name = "oncall-agent"
version = "0.1.0"
description = "Personal on-call agent: Gemma operator + Claude CLI executor under a deterministic permission broker."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "mcp>=1.2",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "sqlglot>=25",       # SQL parsing inside `psql -c '...'` classification
    "bashlex>=0.18",     # bash AST for compositional classifier
    "telethon>=1.36",    # Telegram userbot (milestone 3)
    "openai>=1.55",      # OpenAI-compatible client; we point it at Vercel AI Gateway
    "google-genai>=2.4", # native Google AI Studio / Gemini API client (operator backend)
    "qrcode>=7.4",       # terminal QR rendering for `oncall telegram-login --qr`
    "numpy>=2.4.6",      # cosine matrix over packed float32 embeddings (operator memory)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
oncall = "oncall.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncall"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
