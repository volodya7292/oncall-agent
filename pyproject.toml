[project]
name = "oncall-agent"
version = "0.1.0"
description = "Personal on-call agent: Gemma operator + Claude CLI executor under a deterministic permission broker."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.47",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "httpx>=0.28",
    "sse-starlette>=3.4",
    "mcp>=1.27",
    "aiosqlite>=0.22",
    "python-dotenv>=1.2",
    "sqlglot>=30",       # SQL parsing inside `psql -c '...'` classification
    "bashlex>=0.18",     # bash AST for compositional classifier
    "telethon>=1.43",    # Telegram userbot (milestone 3)
    "openai>=1.55",      # OpenAI-compatible client; we point it at Vercel AI Gateway
    "google-genai>=2.5", # native Google AI Studio / Gemini API client (operator backend)
    "qrcode>=8.2",       # terminal QR rendering for `oncall telegram-login --qr`
    "numpy>=2.4",      # cosine matrix over packed float32 embeddings (operator memory)
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "ruff>=0.15",
]

[project.scripts]
oncall = "oncall.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oncall"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
